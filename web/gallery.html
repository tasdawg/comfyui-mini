<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfy Mini Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #d4d4d8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; padding: 12px 12px 12px 12px; flex: 1; overflow-y: auto; align-content: start; }
        .thumb-card { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; cursor: pointer; transition: transform 150ms, box-shadow 150ms; background-color: #0a0a0a; border: 1px solid #1f2937; }
        .thumb-card:hover { transform: scale(1.04); box-shadow: 0 8px 24px rgba(0,0,0,0.6); border-color: #3b82f6; z-index: 5; }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 6px; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); font-size: 9px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
        .thumb-type-badge { position: absolute; top: 4px; right: 4px; padding: 2px 5px; border-radius: 3px; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; pointer-events: none; }
        .thumb-type-badge.output { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
        .thumb-type-badge.input { background: rgba(96, 165, 250, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }

        /* Fullscreen Modal */
        #gallery-modal { position: fixed; inset: 0; z-index: 100; background: rgba(3,7,18,0.96); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 250ms; pointer-events: none; }
        #gallery-modal.active { opacity: 1; pointer-events: auto; }
        #modal-img-wrap { position: relative; max-width: 92vw; max-height: 86vh; display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none; -webkit-user-select: none; }
        #modal-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; border: 3px solid rgba(63,63,70,0.4); border-top-color: #60a5fa; border-radius: 50%; animation: modal-spin 800ms linear infinite; opacity: 0; transition: opacity 200ms; pointer-events: none; }
        #modal-spinner.show { opacity: 1; }
        @keyframes modal-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        #modal-img { max-width: 92vw; max-height: 86vh; object-fit: contain; border-radius: 4px; box-shadow: 0 16px 48px rgba(0,0,0,0.7); transition: transform 150ms ease-out; will-change: transform; }
        #modal-overlay { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 101; display: flex; gap: 8px; background: rgba(9,9,11,0.92); border: 1px solid #27272a; border-radius: 10px; padding: 8px 14px; backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .overlay-btn { display: flex; align-items: center; gap: 6px; background: #1f2937; color: #e4e4e7; border: none; border-radius: 6px; padding: 6px 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: background 150ms, color 150ms; }
        .overlay-btn:hover { background: #374151; color: #fff; }
        .overlay-btn.primary { background: #2563eb; }
        .overlay-btn.primary:hover { background: #3b82f6; }
        #zoom-badge { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 102; background: rgba(0,0,0,0.85); color: #fff; font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 20px; pointer-events: none; opacity: 0; transition: opacity 300ms; backdrop-filter: blur(4px); }
        #zoom-badge.show { opacity: 1; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="shared-header"></div>

    <!-- Page-specific header content (Gallery page) -->
    <header class="h-9 shrink-0 flex items-center justify-between px-4 border-b border-[#1f2937] bg-[#0a0a0a] z-40">
        <div class="flex items-center gap-3"></div>
        <div class="flex items-center gap-4 shrink-0">
            <button id="btn-output" class="tab-btn active text-xs px-3 py-1 rounded uppercase font-bold transition-colors">OUTPUT</button>
            <button id="btn-input" class="tab-btn text-xs px-3 py-1 rounded uppercase font-bold transition-colors">INPUT</button>
        </div>
    </header>

    <!-- Floating Pagination Bar (Top Right) -->
    <nav id="pagination-bar" style="display:none;" class="fixed top-[40px] right-[12px] z-50 flex items-center gap-3 bg-[#0a0a0a]/95 border border-[#27272a] rounded-lg px-3 py-2 backdrop-blur shadow-lg">
        <button id="prev-btn" class="overlay-btn disabled:opacity-40 disabled:pointer-events-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
        <span id="page-info" class="text-[10px] text-zinc-400 uppercase font-bold tracking-wider">-</span>
        <button id="next-btn" class="overlay-btn disabled:opacity-40 disabled:pointer-events-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
    </nav>

    <main id="gallery-grid" class="gallery-grid flex-1 min-h-0 pt-[48px]"></main>

    <div id="shared-footer"></div>

    <!-- Fullscreen Modal -->
    <div id="gallery-modal">
        <div id="modal-img-wrap">
            <div id="modal-spinner"></div>
            <img id="modal-img" src="" alt="">
        </div>
        <div id="modal-overlay">
            <button id="zoom-toggle-btn" class="overlay-btn"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg> ZOOM</button>
            <button id="zoom-reset-btn" class="overlay-btn" style="display:none;"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg> RESET</button>
            <button id="fav-toggle-btn" class="overlay-btn"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976 2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538 1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976 2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg> <span id="fav-btn-label">ADD TO FAVORITES</span></button>
            <button id="dl-btn" class="overlay-btn primary"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> DOWNLOAD</button>
            <button id="close-modal" class="overlay-btn"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> CLOSE</button>
        </div>
    </div>
    <div id="zoom-badge">1.0x</div>
    </div>

    <script type="module">
        // --- STATE ---
        let currentFolder = 'output';  // 'output' or 'input'
        let currentPage = 0;
        const PAGE_SIZE = 20;
        let allImages = [];
        let activeFavMenuCard = null;

        // --- FAVORITES (server-side, shared across devices) ---
        async function getFavorites() {
            try { const res = await fetch('/mini/load_favorites'); if (!res.ok) return []; return await res.json(); } catch { return []; }
        }
        
        async function saveFavorites(list) {
            try { await fetch('/mini/save_favorites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ list }) }); } catch (e) { console.error('[gallery] Save favorites failed:', e.message); }
        }
        
        async function toggleFavorite(image) {
            const list = await getFavorites();
            const idx = list.indexOf(image.filename);
            if (idx === -1) { list.push(image.filename); } else { list.splice(idx, 1); }
            await saveFavorites(list);
        }

        // --- FAVORITES MENU ---
        function openFavMenu(card) {
            closeFavMenu();
            const menu = card.querySelector('.fav-menu');
            if (menu) { menu.classList.add('active'); activeFavMenuCard = card; }
        }
        
        function closeFavMenu(cardToSkip) {
            if (activeFavMenuCard && activeFavMenuCard !== cardToSkip) {
                const menu = activeFavMenuCard.querySelector('.fav-menu');
                if (menu) menu.classList.remove('active');
            }
            activeFavMenuCard = null;
        }

        // Close fav menu when clicking anywhere outside it
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.thumb-card')) closeFavMenu();
        });
        const els = {
            grid: document.getElementById('gallery-grid'),
            modal: document.getElementById('gallery-modal'),
            modalImgWrap: document.getElementById('modal-img-wrap'),
            modalSpinner: document.getElementById('modal-spinner'),
            modalImg: document.getElementById('modal-img'),
            favToggleBtn: document.getElementById('fav-toggle-btn'),
            dlBtn: document.getElementById('dl-btn'),
            closeBtn: document.getElementById('close-modal'),
            zoomToggleBtn: document.getElementById('zoom-toggle-btn'),
            zoomResetBtn: document.getElementById('zoom-reset-btn'),
            zoomBadge: document.getElementById('zoom-badge'),
            paginationBar: document.getElementById('pagination-bar'),
            pageInfo: document.getElementById('page-info'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn')
        };

        // --- ZOOM STATE (double-tap + wheel zoom) ---
        const MAX_ZOOM = 6;
        const MIN_ZOOM = 1;
        let zoomScale = 1;
        let zoomTx = 0;
        let zoomTy = 0;
        let lastTapTime = 0;

        function applyTransform() {
            if (!els.modalImg) return;
            els.modalImg.style.transform = `translate(${zoomTx}px, ${zoomTy}px) scale(${zoomScale})`;
            els.zoomResetBtn.style.display = zoomScale > 1 ? 'flex' : 'none';
        }

        function showZoomBadge(text) {
            if (!els.zoomBadge) return;
            els.zoomBadge.textContent = text;
            els.zoomBadge.classList.add('show');
            clearTimeout(els._badgeTimeout);
            els._badgeTimeout = setTimeout(() => els.zoomBadge.classList.remove('show'), 800);
        }

        function clampPan() {
            if (zoomScale <= 1) { zoomTx = 0; zoomTy = 0; return; }
            const wrapEl = els.modalImgWrap;
            if (!wrapEl || !els.modalImg.naturalWidth) return;
            const w = wrapEl.clientWidth;
            const h = wrapEl.clientHeight;
            const imgW = els.modalImg.naturalWidth * zoomScale;
            const imgH = els.modalImg.naturalHeight * zoomScale;
            if (imgW <= w + 20) { zoomTx = 0; } else { zoomTx = Math.max(-Math.max(0, imgW - w), Math.min(0, -imgW + w)); }
            if (imgH <= h + 20) { zoomTy = 0; } else { zoomTy = Math.max(-Math.max(0, imgH - h), Math.min(0, -imgH + h)); }
        }

        function setZoom(newScale, cx, cy) {
            const prevScale = zoomScale;
            zoomScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newScale));
            if (zoomScale === MIN_ZOOM && zoomScale !== prevScale) {
                zoomTx = 0; zoomTy = 0;
                applyTransform();
                showZoomBadge('1.0x');
                return;
            }
            // Zoom toward pointer (cx, cy relative to image element)
            if (els.modalImg.naturalWidth && cx !== undefined) {
                const rect = els.modalImg.getBoundingClientRect();
                const imgCx = cx - rect.left;
                const imgCy = cy - rect.top;
                const factor = zoomScale / prevScale;
                zoomTx = imgCx - (imgCx - zoomTx) * factor;
                zoomTy = imgCy - (imgCy - zoomTy) * factor;
            }
            clampPan();
            applyTransform();
            showZoomBadge(zoomScale.toFixed(1) + 'x');
        }

        function resetZoom() { setZoom(1, undefined, undefined); }

        // --- DOUBLE-TAP ZOOM on modal image (click-based, mobile-friendly) ---
        function setupDoubleTapZoom() {
            const wrap = els.modalImgWrap;
            if (!wrap) return;
            wrap.addEventListener('click', (e) => {
                if (!els.modal.classList.contains('active')) return;
                if (e.target === els.closeBtn || e.target.closest('#modal-overlay')) return;
                const now = Date.now();
                if (now - lastTapTime < 320) {
                    lastTapTime = 0;
                    if (zoomScale > 1) resetZoom();
                    else setZoom(2.5, e.clientX, e.clientY);
                } else {
                    lastTapTime = now;
                }
            });
        }

        // --- WHEEL ZOOM on desktop ---
        function setupWheelZoom() {
            const wrap = els.modalImgWrap;
            if (!wrap) return;
            wrap.addEventListener('wheel', (e) => {
                if (!els.modal.classList.contains('active')) return;
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                setZoom(zoomScale * delta, e.clientX, e.clientY);
            }, { passive: false });
        }

        // --- TAB SWITCHING ---
        function switchFolder(type) {
            currentFolder = type;
            currentPage = 0;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn text-xs px-3 py-1 rounded uppercase font-bold transition-colors';
            });
            const activeBtn = type === 'output' ? els.btnOutput : els.btnInput;
            if (activeBtn) activeBtn.className = 'tab-btn active text-xs px-3 py-1 rounded uppercase font-bold transition-colors bg-blue-600 text-white border border-blue-500';
            loadGallery();
        }

        // --- LOAD GALLERY ---
        async function loadGallery() {
            els.grid.innerHTML = '';
            
            try {
                const res = await fetch(`/mini/files?type=${currentFolder}&t=${Date.now()}`, { headers: { 'Cache-Control': 'no-cache' } });
                if (!res.ok) throw new Error(`Server error ${res.status}`);

                // Check if response is actually JSON (not login page HTML)
                const contentType = res.headers.get('content-type') || '';
                if (!contentType.includes('application/json')) {
                    const text = await res.text();
                    throw new Error(text.includes('<html') ? 'Authentication required - please log in to ComfyUI first' : `Unexpected response: ${text.substring(0, 200)}`);
                }

                const data = await res.json();
                if (data.error) throw new Error(data.error);

                let allImagesRaw = [];
                // Handle both formats: {images:[...]} and {[0]:{filename:...}}
                if (Array.isArray(data)) {
                    allImagesRaw = data;
                } else if (Array.isArray(data.images)) {
                    allImagesRaw = data.images;
                } else if (data && typeof data === 'object') {
                    // Check for ComfyUI-style keys like "0", "1", etc.
                    const keys = Object.keys(data).filter(k => !isNaN(parseInt(k)));
                    if (keys.length > 0) {
                        allImagesRaw = keys.map(k => ({ filename: data[k].filename || k, subfolder: data[k].subfolder || '', type: currentFolder }));
                    }
                }

                console.log(`[Gallery] Loaded ${allImagesRaw.length} images for ${currentFolder}`);
                allImages = allImagesRaw;
                
                renderPage(currentPage);
            } catch (e) {
                console.error('[Gallery] Load error:', e);
                els.grid.innerHTML = `<div class="flex items-center justify-center text-red-400 text-xs uppercase tracking-widest p-8">${e.message}</div>`;
            }
        }

        // --- RENDER PAGE ---
        function renderPage(page) {
            if (!els.grid) return;
            els.grid.innerHTML = '';

            const totalPages = Math.ceil(allImages.length / PAGE_SIZE);
            const start = page * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, allImages.length);

            for (let i = start; i < end; i++) {
                const img = allImages[i];
                const card = document.createElement('div');
                card.className = 'thumb-card';

                const thumbImg = document.createElement('img');
                thumbImg.src = `/view?filename=${encodeURIComponent(img.filename)}&subfolder=${encodeURIComponent(img.subfolder || '')}&type=${currentFolder}&t=${Date.now()}`;
                thumbImg.alt = img.filename;
                thumbImg.loading = 'lazy';
                thumbImg.onerror = () => {
                    console.error(`[Gallery] Failed to load image: ${thumbImg.src}`);
                    thumbImg.style.display = 'none';
                };

                const label = document.createElement('div');
                label.className = 'thumb-label';
                label.textContent = img.filename.replace(/\.[^/.]+$/, '');  // strip extension

                const badge = document.createElement('div');
                badge.className = `thumb-type-badge ${currentFolder}`;
                badge.textContent = currentFolder.toUpperCase();

                card.append(thumbImg, label, badge);
                card.addEventListener('click', () => openModal(img));
                els.grid.appendChild(card);
            }

            updatePagination(page, totalPages);
        }

        function updatePagination(page, totalPages) {
            if (totalPages <= 1) {
                els.paginationBar.style.display = 'none';
                return;
            }

            els.paginationBar.style.display = 'flex';
            els.pageInfo.textContent = `Page ${page + 1} of ${totalPages}`;
            els.prevBtn.disabled = page === 0;
            els.nextBtn.disabled = page >= totalPages - 1;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(allImages.length / PAGE_SIZE);
            if (page < 0 || page >= totalPages) return;
            currentPage = page;
            renderPage(currentPage);
        }

        // --- MODAL ---
        function openModal(image) {
            els.modalImg.src = `/view?filename=${encodeURIComponent(image.filename)}&subfolder=${encodeURIComponent(image.subfolder || '')}&type=${currentFolder}&t=${Date.now()}`;
            els.dlBtn.dataset.url = `/view?filename=${encodeURIComponent(image.filename)}&subfolder=${encodeURIComponent(image.subfolder || '')}&type=${currentFolder}&t=${Date.now()}`;
            els.dlBtn.dataset.filename = image.filename;

            if (els.modalSpinner) els.modalSpinner.classList.add('show');
            els.modalImg.onload = () => {
                if (els.modalSpinner) els.modalSpinner.classList.remove('show');
            };

            const isFav = getFavorites().includes(image.filename);
            if (els.favToggleBtn) {
                els.favToggleBtn.innerHTML = isFav
                    ? `<svg class="w-3.5 h-3.5" fill="currentColor" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg> <span>REMOVE FROM FAVORITES</span>`
                    : `<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg> <span>ADD TO FAVORITES</span>`;
            }

            closeFavMenu();
            els.modal.classList.add('active');
        }

        function closeGalleryModal() {
            if (els.modalSpinner) els.modalSpinner.classList.remove('show');
            els.modal.classList.remove('active');
            setTimeout(() => { els.modalImg.src = ''; }, 300);
        }

        // --- DOWNLOAD ---
        async function downloadImage() {
            const url = els.dlBtn.dataset.url;
            if (!url) return;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`Download failed: ${res.status}`);

                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = els.dlBtn.dataset.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            } catch (e) {
                window.open(els.dlBtn.dataset.url, '_blank');
            }
        }

        async function downloadImageFromGallery(image) {
            const url = `/view?filename=${encodeURIComponent(image.filename)}&subfolder=${encodeURIComponent(image.subfolder || '')}&type=${currentFolder}&t=${Date.now()}`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`Download failed: ${res.status}`);
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = image.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            } catch (e) {
                window.open(url, '_blank');
            }
        }

        // --- KEYBOARD SHORTCUTS ---
        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                if (!els.modal.classList.contains('active')) return;
                if (e.key === 'Escape') closeGalleryModal();
                if (e.key === '+' || e.key === '=') setZoom(zoomScale * 1.3, window.innerWidth / 2, window.innerHeight / 2);
                if (e.key === '-') resetZoom();
            });

            els.modal.addEventListener('click', (e) => {
                if (e.target === els.modal || e.target === els.modalImg) {
                    closeGalleryModal();
                }
            });
        }

        // --- SHARED COMPONENT LOADER ---
        async function loadSharedComponents() {
            try {
                const [headerRes, footerRes] = await Promise.all([
                    fetch('/mini/shared/header.html?t=' + Date.now()),
                    fetch('/mini/shared/footer.html?t=' + Date.now())
                ]);

                if (headerRes.ok) {
                    const headerEl = document.getElementById('shared-header');
                    if (headerEl) headerEl.innerHTML = await headerRes.text();
                    
                    // Mobile menu toggle
                    const mobileBtn = document.getElementById('mobile-menu-btn');
                    const dropdown = document.getElementById('mobile-menu-dropdown');
                    if (mobileBtn && dropdown) {
                        mobileBtn.addEventListener('click', () => {
                            dropdown.classList.toggle('hidden');
                        });
                        document.addEventListener('click', (e) => {
                            if (!dropdown.contains(e.target) && e.target !== mobileBtn) {
                                dropdown.classList.add('hidden');
                            }
                        });
                    }
                }

                if (footerRes.ok) {
                    const footerEl = document.getElementById('shared-footer');
                    if (footerEl) footerEl.innerHTML = await footerRes.text();
                }
            } catch (e) { console.error('[Shared] Component load error:', e); }
        }

        // --- INIT ---
        async function init() {
            els.btnOutput = document.getElementById('btn-output');
            els.btnInput = document.getElementById('btn-input');

            els.prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
            els.nextBtn.addEventListener('click', () => goToPage(currentPage + 1));
            els.closeBtn.addEventListener('click', closeGalleryModal);
            els.dlBtn.addEventListener('click', downloadImage);
            if (els.favToggleBtn) {
                els.favToggleBtn.addEventListener('click', () => {
                    const src = els.modalImg.src;
                    const match = src.match(/filename=([^&]+)/);
                    if (!match) return;
                    const fname = decodeURIComponent(match[1]);
                    toggleFavorite({ filename: fname });
                    openModal(allImages.find(img => img.filename === fname) || { filename: fname, subfolder: '', type: currentFolder });
                });
            }

            if (els.zoomToggleBtn) els.zoomToggleBtn.addEventListener('click', () => {
                if (zoomScale > 1) resetZoom();
                else setZoom(2.5, window.innerWidth / 2, window.innerHeight / 2);
            });
            if (els.zoomResetBtn) els.zoomResetBtn.addEventListener('click', resetZoom);

            if (els.btnOutput) els.btnOutput.addEventListener('click', () => switchFolder('output'));
            if (els.btnInput) els.btnInput.addEventListener('click', () => switchFolder('input'));

            setupDoubleTapZoom();
            setupWheelZoom();
            setupKeyboard();
            await loadGallery();
            await loadSharedComponents();
        }

        init().catch(e => { console.error(e); alert('Init Error: ' + e.message); });
    </script>
</body>
</html>
