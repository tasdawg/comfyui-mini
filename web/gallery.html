<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfy Mini Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030712; color: #d4d4d8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- Mobile-first responsive grid --- */
        .gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; padding: 8px 8px 16px 8px; flex: 1; overflow-y: auto; align-content: start; -webkit-overflow-scrolling: touch; }
        @media (min-width: 480px)  { .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 10px 10px 16px 10px; } }
        @media (min-width: 768px)  { .gallery-grid { grid-template-columns: repeat(4, 1fr); } }
        @media (min-width: 1024px) { .gallery-grid { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; padding: 12px 12px 16px 12px; } }

        .thumb-card { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; cursor: pointer; background-color: #0a0a0a; border: 1px solid #1f2937; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        .thumb-card:active { transform: scale(0.97); border-color: #3b82f6; }
        .thumb-card img { width: 100%; height: 100%; object-fit: cover; display: block; background-color: #18181b; }
        .thumb-label { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 6px; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent); font-size: 9px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
        .thumb-type-badge { position: absolute; top: 4px; right: 4px; padding: 2px 5px; border-radius: 3px; font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; pointer-events: none; }
        .thumb-type-badge.output { background: rgba(74, 222, 128, 0.15); color: #4ade80; border: 1px solid rgba(74, 222, 128, 0.3); }
        .thumb-type-badge.input { background: rgba(96, 165, 250, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }
        @media (hover: hover) {
            .thumb-card { transition: transform 150ms, box-shadow 150ms; }
            .thumb-card:hover { transform: scale(1.04); box-shadow: 0 8px 24px rgba(0,0,0,0.6); border-color: #3b82f6; z-index: 5; }
        }

        /* --- Folder tiles --- */
        .folder-card { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; cursor: pointer; background-color: #0d1117; border: 1px solid #1f2937; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
        .folder-card:active { transform: scale(0.97); border-color: #60a5fa; background-color: #111827; }
        .folder-card svg { width: 34%; height: auto; color: #60a5fa; opacity: 0.85; }
        .folder-name { font-size: 10px; font-weight: 600; color: #e4e4e7; max-width: 92%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .folder-count { position: absolute; top: 4px; right: 4px; padding: 2px 6px; border-radius: 999px; font-size: 8px; font-weight: 700; background: rgba(96, 165, 250, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }

        /* --- Send-to-workflow popup items --- */
        .sendto-item { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; background: #121212; border: 1px solid #1f2937; border-radius: 8px; color: #d4d4d8; font-size: 11px; cursor: pointer; transition: all 150ms; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .sendto-item:hover { background: #1f2937; border-color: #3b82f6; color: #fff; }
        .sendto-item:active { transform: scale(0.98); }
        .sendto-item svg { width: 14px; height: 14px; color: #60a5fa; flex-shrink: 0; }
        .sendto-item .sendto-label { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sendto-item .sendto-sub { font-size: 9px; color: #71717a; white-space: nowrap; flex-shrink: 0; }

        /* --- Breadcrumb path bar --- */
        #breadcrumb-bar { display: flex; align-items: center; gap: 2px; height: 30px; padding: 0 10px; border-bottom: 1px solid #1f2937; background: #0a0a0a; overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
        #breadcrumb-bar::-webkit-scrollbar { display: none; }
        .crumb { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; color: #71717a; padding: 4px 7px; border-radius: 5px; cursor: pointer; white-space: nowrap; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        .crumb:active { background: #1f2937; color: #e4e4e7; }
        .crumb.current { color: #60a5fa; cursor: default; }
        .crumb-sep { color: #3f3f46; font-size: 10px; flex-shrink: 0; }

        /* Fullscreen Modal */
        #gallery-modal { position: fixed; inset: 0; z-index: 100; background: rgba(3,7,18,0.96); backdrop-filter: blur(4px); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity 250ms; pointer-events: none; }
        #gallery-modal.active { opacity: 1; pointer-events: auto; }
        #modal-img-wrap { position: relative; max-width: 92vw; max-height: 86vh; display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none; -webkit-user-select: none; }
        #modal-spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; border: 3px solid rgba(63,63,70,0.4); border-top-color: #60a5fa; border-radius: 50%; animation: modal-spin 800ms linear infinite; opacity: 0; transition: opacity 200ms; pointer-events: none; }
        #modal-spinner.show { opacity: 1; }
        @keyframes modal-spin { to { transform: translate(-50%, -50%) rotate(360deg); } }
        #modal-img { max-width: 92vw; max-height: 86vh; object-fit: contain; border-radius: 4px; box-shadow: 0 16px 48px rgba(0,0,0,0.7); transition: transform 150ms ease-out; will-change: transform; }
        #modal-overlay { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 101; display: flex; gap: 8px; background: rgba(9,9,11,0.92); border: 1px solid #27272a; border-radius: 10px; padding: 8px 14px; backdrop-filter: blur(6px); box-shadow: 0 8px 24px rgba(0,0,0,0.5); max-width: 94vw; overflow-x: auto; }
        .overlay-btn { display: flex; align-items: center; gap: 6px; background: #1f2937; color: #e4e4e7; border: none; border-radius: 6px; padding: 6px 12px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; transition: background 150ms, color 150ms; white-space: nowrap; }
        .overlay-btn:hover { background: #374151; color: #fff; }
        .overlay-btn.primary { background: #2563eb; }
        .overlay-btn.primary:hover { background: #3b82f6; }
        #zoom-badge { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 102; background: rgba(0,0,0,0.85); color: #fff; font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 20px; pointer-events: none; opacity: 0; transition: opacity 300ms; backdrop-filter: blur(4px); }
        #zoom-badge.show { opacity: 1; }

        /* Floating Pagination Bar (Top Right) */
        #pagination-bar { position: absolute; top: 42px; right: 12px; z-index: 50; display: none; align-items: center; gap: 3px; background: rgba(10,10,10,0.95); border: 1px solid #27272a; border-radius: 8px; padding: 3px 6px; backdrop-filter: blur(6px); box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
        #pagination-bar .overlay-btn { padding: 5px 9px; background: transparent; }
        #pagination-bar .overlay-btn:hover { background: #1f2937; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    </style>
</head>
<body>
    <div id="shared-header"></div>

    <!-- Page-specific header content (Gallery page) -->
    <header class="h-9 shrink-0 flex items-center justify-between px-4 border-b border-[#1f2937] bg-[#0a0a0a] z-40">
        <div class="flex items-center gap-3"></div>
        <div class="flex items-center gap-2 shrink-0">
            <button id="btn-output" class="tab-btn active text-xs px-3 py-1 rounded uppercase font-bold transition-colors">OUTPUT</button>
            <button id="btn-input" class="tab-btn text-xs px-3 py-1 rounded uppercase font-bold transition-colors">INPUT</button>
            <button id="btn-refresh" class="text-zinc-500 hover:text-white active:scale-90 transition-colors p-1" title="Refresh">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h5M20 20v-5h-5M5.5 9a7 7 0 0111.4-2.5L20 9M4 15l3.1 2.5A7 7 0 0018.5 15"></path></svg>
            </button>
        </div>
    </header>

    <!-- Breadcrumb folder path -->
    <nav id="breadcrumb-bar"></nav>

    <div class="relative flex-1 min-h-0 flex flex-col">
        <main id="gallery-grid" class="gallery-grid flex-1 min-h-0"></main>

        <!-- Floating Pagination Bar (Top Right) -->
        <nav id="pagination-bar">
            <button id="prev-btn" class="overlay-btn disabled:opacity-40 disabled:pointer-events-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
            <span id="page-info" class="text-[10px] text-zinc-400 uppercase font-bold tracking-wider">-</span>
            <button id="next-btn" class="overlay-btn disabled:opacity-40 disabled:pointer-events-none"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
        </nav>
    </div>

    <div id="shared-footer"></div>

    <!-- Fullscreen Modal -->
    <div id="gallery-modal">
        <div id="modal-img-wrap">
            <div id="modal-spinner"></div>
            <img id="modal-img" src="" alt="">
        </div>
        <div id="modal-overlay">
            <button id="zoom-toggle-btn" class="overlay-btn"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg> ZOOM</button>
            <button id="zoom-reset-btn" class="overlay-btn" style="display:none;"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg> RESET</button>
            <button id="fav-toggle-btn" class="overlay-btn"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976 2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538 1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976 2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg> <span id="fav-btn-label">ADD TO FAVORITES</span></button>
            <button id="sendto-btn" class="overlay-btn"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg> SEND TO WORKFLOW</button>
            <button id="dl-btn" class="overlay-btn primary"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg> DOWNLOAD</button>
            <button id="close-modal" class="overlay-btn"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> CLOSE</button>
        </div>
    </div>
    <div id="zoom-badge">1.0x</div>

    <!-- Send to Workflow popup -->
    <div id="sendto-overlay" style="display:none;" class="fixed inset-0 z-[103] bg-black/70 backdrop-blur-[2px]">
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[92vw] max-w-sm max-h-[70vh] flex flex-col bg-[#0d0d0f] border border-[#27272a] rounded-xl shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between px-4 py-3 border-b border-[#1f2937] shrink-0">
                <span id="sendto-title" class="text-[11px] font-bold uppercase tracking-wider text-zinc-300">Send to workflow</span>
                <button id="sendto-close" class="text-zinc-500 hover:text-white p-1 transition-colors" title="Close">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <button id="sendto-back" style="display:none;" class="flex items-center gap-2 px-4 py-2 text-[10px] font-bold uppercase tracking-wider text-zinc-500 hover:text-white hover:bg-[#1f2937] transition-colors border-b border-[#1f2937] shrink-0">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                All workflows
            </button>
            <div id="sendto-status" class="text-center text-zinc-500 text-[10px] py-5 uppercase tracking-wider shrink-0"></div>
            <div id="sendto-list" class="overflow-y-auto p-2 flex-1 min-h-0 flex flex-col gap-1"></div>
        </div>
    </div>

    <script type="module">
        // --- STATE ---
        let currentFolder = 'output';   // 'output' or 'input'
        let currentPath = '';           // subfolder path, e.g. "runs/takes"
        let currentPage = 0;
        const PAGE_SIZE = 24;
        const THUMB_SIZE = 360;
        let allImages = [];
        let allFolders = [];
        const listingCache = new Map(); // "type|path" -> {folders, images}
        let modalImage = null;         // image currently shown in the modal
        let sendtoWorkflow = null;     // workflow filename selected in the send-to popup

        // --- HELPERS ---
        const rootLabel = () => currentFolder.toUpperCase();
        const pathSegments = () => currentPath ? currentPath.split('/') : [];
        const viewUrl = (img) => `/view?filename=${encodeURIComponent(img.filename)}&subfolder=${encodeURIComponent(currentPath)}&type=${currentFolder}`;
        const thumbUrl = (filename) => `/mini/thumb?filename=${encodeURIComponent(filename)}&path=${encodeURIComponent(currentPath)}&type=${currentFolder}&size=${THUMB_SIZE}`;

        // --- FAVORITES (server-side, shared across devices) ---
        async function getFavorites() {
            try { const res = await fetch('/mini/load_favorites'); if (!res.ok) return []; return await res.json(); } catch { return []; }
        }
        async function saveFavorites(list) {
            try { await fetch('/mini/save_favorites', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ list }) }); } catch (e) { console.error('[gallery] Save favorites failed:', e.message); }
        }
        async function toggleFavorite(image) {
            const list = await getFavorites();
            const idx = list.indexOf(image.filename);
            if (idx === -1) { list.push(image.filename); } else { list.splice(idx, 1); }
            await saveFavorites(list);
        }

        const els = {
            grid: document.getElementById('gallery-grid'),
            breadcrumb: document.getElementById('breadcrumb-bar'),
            modal: document.getElementById('gallery-modal'),
            modalImgWrap: document.getElementById('modal-img-wrap'),
            modalSpinner: document.getElementById('modal-spinner'),
            modalImg: document.getElementById('modal-img'),
            favToggleBtn: document.getElementById('fav-toggle-btn'),
            dlBtn: document.getElementById('dl-btn'),
            closeBtn: document.getElementById('close-modal'),
            zoomToggleBtn: document.getElementById('zoom-toggle-btn'),
            zoomResetBtn: document.getElementById('zoom-reset-btn'),
            zoomBadge: document.getElementById('zoom-badge'),
            paginationBar: document.getElementById('pagination-bar'),
            pageInfo: document.getElementById('page-info'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn'),
            btnOutput: document.getElementById('btn-output'),
            btnInput: document.getElementById('btn-input'),
            btnRefresh: document.getElementById('btn-refresh'),
            sendtoBtn: document.getElementById('sendto-btn'),
            sendtoOverlay: document.getElementById('sendto-overlay'),
            sendtoTitle: document.getElementById('sendto-title'),
            sendtoClose: document.getElementById('sendto-close'),
            sendtoBack: document.getElementById('sendto-back'),
            sendtoList: document.getElementById('sendto-list'),
            sendtoStatus: document.getElementById('sendto-status')
        };

        // --- ZOOM STATE (double-tap + wheel zoom) ---
        const MAX_ZOOM = 6;
        const MIN_ZOOM = 1;
        let zoomScale = 1;
        let zoomTx = 0;
        let zoomTy = 0;
        let lastTapTime = 0;

        function applyTransform() {
            if (!els.modalImg) return;
            els.modalImg.style.transform = `translate(${zoomTx}px, ${zoomTy}px) scale(${zoomScale})`;
            els.zoomResetBtn.style.display = zoomScale > 1 ? 'flex' : 'none';
        }

        function showZoomBadge(text) {
            if (!els.zoomBadge) return;
            els.zoomBadge.textContent = text;
            els.zoomBadge.classList.add('show');
            clearTimeout(els._badgeTimeout);
            els._badgeTimeout = setTimeout(() => els.zoomBadge.classList.remove('show'), 800);
        }

        function clampPan() {
            if (zoomScale <= 1) { zoomTx = 0; zoomTy = 0; return; }
            const wrapEl = els.modalImgWrap;
            if (!wrapEl || !els.modalImg.naturalWidth) return;
            const w = wrapEl.clientWidth;
            const h = wrapEl.clientHeight;
            const imgW = els.modalImg.naturalWidth * zoomScale;
            const imgH = els.modalImg.naturalHeight * zoomScale;
            if (imgW <= w + 20) { zoomTx = 0; } else { zoomTx = Math.max(-Math.max(0, imgW - w), Math.min(0, -imgW + w)); }
            if (imgH <= h + 20) { zoomTy = 0; } else { zoomTy = Math.max(-Math.max(0, imgH - h), Math.min(0, -imgH + h)); }
        }

        function setZoom(newScale, cx, cy) {
            const prevScale = zoomScale;
            zoomScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, newScale));
            if (zoomScale === MIN_ZOOM && zoomScale !== prevScale) {
                zoomTx = 0; zoomTy = 0;
                applyTransform();
                showZoomBadge('1.0x');
                return;
            }
            if (els.modalImg.naturalWidth && cx !== undefined) {
                const rect = els.modalImg.getBoundingClientRect();
                const imgCx = cx - rect.left;
                const imgCy = cy - rect.top;
                const factor = zoomScale / prevScale;
                zoomTx = imgCx - (imgCx - zoomTx) * factor;
                zoomTy = imgCy - (imgCy - zoomTy) * factor;
            }
            clampPan();
            applyTransform();
            showZoomBadge(zoomScale.toFixed(1) + 'x');
        }

        function resetZoom() { setZoom(1, undefined, undefined); }

        // --- DOUBLE-TAP ZOOM on modal image (click-based, mobile-friendly) ---
        function setupDoubleTapZoom() {
            const wrap = els.modalImgWrap;
            if (!wrap) return;
            wrap.addEventListener('click', (e) => {
                if (!els.modal.classList.contains('active')) return;
                if (e.target === els.closeBtn || e.target.closest('#modal-overlay')) return;
                const now = Date.now();
                if (now - lastTapTime < 320) {
                    lastTapTime = 0;
                    if (zoomScale > 1) resetZoom();
                    else setZoom(2.5, e.clientX, e.clientY);
                } else {
                    lastTapTime = now;
                }
            });
        }

        // --- WHEEL ZOOM on desktop ---
        function setupWheelZoom() {
            const wrap = els.modalImgWrap;
            if (!wrap) return;
            wrap.addEventListener('wheel', (e) => {
                if (!els.modal.classList.contains('active')) return;
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                setZoom(zoomScale * delta, e.clientX, e.clientY);
            }, { passive: false });
        }

        // --- NAVIGATION ---
        function navigate(type, path) {
            currentFolder = type || currentFolder;
            currentPath = path || '';
            currentPage = 0;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = 'tab-btn text-xs px-3 py-1 rounded uppercase font-bold transition-colors';
            });
            const activeBtn = currentFolder === 'output' ? els.btnOutput : els.btnInput;
            if (activeBtn) activeBtn.className = 'tab-btn active text-xs px-3 py-1 rounded uppercase font-bold transition-colors bg-blue-600 text-white border border-blue-500';
            renderBreadcrumb();
            loadGallery();
        }

        function renderBreadcrumb() {
            if (!els.breadcrumb) return;
            els.breadcrumb.innerHTML = '';
            const segments = [rootLabel(), ...pathSegments()];
            segments.forEach((seg, i) => {
                if (i > 0) {
                    const sep = document.createElement('span');
                    sep.className = 'crumb-sep';
                    sep.textContent = '›';
                    els.breadcrumb.appendChild(sep);
                }
                const crumb = document.createElement('span');
                const isLast = i === segments.length - 1;
                crumb.className = 'crumb' + (isLast ? ' current' : '');
                crumb.textContent = seg;
                if (!isLast) {
                    const targetPath = i === 0 ? '' : segments.slice(1, i).join('/');
                    crumb.addEventListener('click', () => navigate(currentFolder, targetPath));
                }
                els.breadcrumb.appendChild(crumb);
            });
        }

        // --- LOAD GALLERY ---
        async function loadGallery() {
            els.grid.innerHTML = '';
            const cacheKey = `${currentFolder}|${currentPath}`;

            let data = listingCache.get(cacheKey);
            if (!data) {
                try {
                    const res = await fetch(`/mini/files?type=${currentFolder}&path=${encodeURIComponent(currentPath)}`, { headers: { 'Cache-Control': 'no-cache' } });
                    if (!res.ok) throw new Error(`Server error ${res.status}`);

                    const contentType = res.headers.get('content-type') || '';
                    if (!contentType.includes('application/json')) {
                        const text = await res.text();
                        throw new Error(text.includes('<html') ? 'Authentication required - please log in to ComfyUI first' : `Unexpected response: ${text.substring(0, 200)}`);
                    }

                    data = await res.json();
                    if (data.error) throw new Error(data.error);
                    listingCache.set(cacheKey, data);
                } catch (e) {
                    console.error('[Gallery] Load error:', e);
                    els.grid.innerHTML = `<div class="col-span-full flex items-center justify-center text-red-400 text-xs uppercase tracking-widest p-8">${e.message}</div>`;
                    els.paginationBar.style.display = 'none';
                    return;
                }
            }

            allFolders = Array.isArray(data.folders) ? data.folders : [];
            allImages = Array.isArray(data.images) ? data.images : [];
            console.log(`[Gallery] ${allFolders.length} folders, ${allImages.length} images in ${rootLabel()}:${currentPath}`);

            renderPage(currentPage);
        }

        // --- RENDER PAGE ---
        function renderPage(page) {
            if (!els.grid) return;
            els.grid.innerHTML = '';

            // Folder tiles first (always visible, before images)
            for (const folder of allFolders) {
                const name = typeof folder === 'string' ? folder : folder.name;
                const count = typeof folder === 'object' ? folder.count : null;
                const card = document.createElement('div');
                card.className = 'folder-card';
                const target = currentPath ? `${currentPath}/${name}` : name;

                const icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                icon.setAttribute('fill', 'none');
                icon.setAttribute('stroke', 'currentColor');
                icon.setAttribute('viewBox', '0 0 24 24');
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>';
                card.appendChild(icon);

                const label = document.createElement('div');
                label.className = 'folder-name';
                label.textContent = name;
                card.appendChild(label);

                if (count !== null) {
                    const badge = document.createElement('div');
                    badge.className = 'folder-count';
                    badge.textContent = count;
                    card.appendChild(badge);
                }

                card.addEventListener('click', () => navigate(currentFolder, target));
                els.grid.appendChild(card);
            }

            // Paginated image cards
            const totalPages = Math.ceil(allImages.length / PAGE_SIZE);
            const start = page * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, allImages.length);

            if (allImages.length === 0 && allFolders.length === 0) {
                els.grid.innerHTML = '<div class="col-span-full flex items-center justify-center text-zinc-600 text-xs uppercase tracking-widest p-8">No images here yet</div>';
            }

            for (let i = start; i < end; i++) {
                const img = allImages[i];
                const card = document.createElement('div');
                card.className = 'thumb-card';

                const thumbImg = document.createElement('img');
                thumbImg.src = thumbUrl(img.filename);
                thumbImg.alt = img.filename;
                thumbImg.loading = 'lazy';
                thumbImg.decoding = 'async';
                thumbImg.onerror = () => {
                    console.error(`[Gallery] Failed to load thumb: ${thumbImg.src}`);
                    card.style.display = 'none';
                };

                const label = document.createElement('div');
                label.className = 'thumb-label';
                label.textContent = img.filename.replace(/\.[^/.]+$/, '');

                const badge = document.createElement('div');
                badge.className = `thumb-type-badge ${currentFolder}`;
                badge.textContent = currentFolder.toUpperCase();

                card.append(thumbImg, label, badge);
                card.addEventListener('click', () => openModal(img));
                els.grid.appendChild(card);
            }

            updatePagination(page, totalPages);
        }

        function updatePagination(page, totalPages) {
            if (!els.paginationBar) return;
            if (totalPages <= 1) {
                els.paginationBar.style.display = 'none';
                return;
            }
            els.paginationBar.style.display = 'flex';
            els.pageInfo.textContent = `Page ${page + 1} of ${totalPages}`;
            els.prevBtn.disabled = page === 0;
            els.nextBtn.disabled = page >= totalPages - 1;
        }

        function goToPage(page) {
            const totalPages = Math.ceil(allImages.length / PAGE_SIZE);
            if (page < 0 || page >= totalPages) return;
            currentPage = page;
            renderPage(currentPage);
            els.grid.scrollTop = 0;
        }

        // --- MODAL ---
        async function openModal(image) {
            modalImage = image;
            els.modalImg.src = viewUrl(image);
            els.dlBtn.dataset.url = viewUrl(image);
            els.dlBtn.dataset.filename = image.filename;

            if (els.modalSpinner) els.modalSpinner.classList.add('show');
            els.modalImg.onload = () => {
                if (els.modalSpinner) els.modalSpinner.classList.remove('show');
            };

            let isFav = false;
            try { const favs = await getFavorites(); isFav = favs.includes(image.filename); } catch {}
            if (els.favToggleBtn) {
                const star = isFav ? 'fill="currentColor" stroke="currentColor"' : 'fill="none" stroke="currentColor"';
                els.favToggleBtn.innerHTML = `<svg class="w-3.5 h-3.5" ${star} viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976 2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538 1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976 2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"></path></svg> <span>${isFav ? 'REMOVE FROM FAVORITES' : 'ADD TO FAVORITES'}</span>`;
            }

            closeGalleryModalZoom();
            els.modal.classList.add('active');
        }

        function closeGalleryModal() {
            if (els.modalSpinner) els.modalSpinner.classList.remove('show');
            els.modal.classList.remove('active');
            setTimeout(() => { els.modalImg.src = ''; }, 300);
        }

        function closeGalleryModalZoom() { resetZoom(); }

        // --- DOWNLOAD ---
        async function downloadImage() {
            const url = els.dlBtn.dataset.url;
            if (!url) return;
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`Download failed: ${res.status}`);
                const blob = await res.blob();
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = els.dlBtn.dataset.filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(a.href);
            } catch (e) {
                window.open(els.dlBtn.dataset.url, '_blank');
            }
        }

        // --- SEND TO WORKFLOW ---
        function openSendTo() {
            if (!modalImage) return;
            sendtoWorkflow = null;
            els.sendtoOverlay.style.display = 'block';
            renderSendtoWorkflows();
        }

        function closeSendTo() {
            els.sendtoOverlay.style.display = 'none';
            sendtoWorkflow = null;
        }

        function sendtoItem(icon, label, sub, onclick) {
            const b = document.createElement('button');
            b.className = 'sendto-item';
            b.innerHTML = `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24">${icon}</svg><span class="sendto-label"></span><span class="sendto-sub">${sub || ''}</span>`;
            b.querySelector('.sendto-label').textContent = label;
            b.addEventListener('click', onclick);
            return b;
        }

        async function renderSendtoWorkflows() {
            els.sendtoTitle.textContent = 'Send to workflow';
            els.sendtoBack.style.display = 'none';
            els.sendtoList.innerHTML = '';
            els.sendtoStatus.textContent = 'Loading workflows…';
            try {
                const res = await fetch('/mini/list_workflows');
                const data = await res.json();
                const files = Array.isArray(data.workflows) ? data.workflows : [];
                els.sendtoStatus.textContent = files.length ? '' : 'No workflows found';
                for (const f of files) {
                    els.sendtoList.appendChild(sendtoItem(
                        '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>',
                        f.replace(/\.json$/, ''), '',
                        () => renderSendtoNodes(f)
                    ));
                }
            } catch (e) {
                els.sendtoStatus.textContent = 'Failed to load workflows';
                console.error('[Gallery] Send-to list error:', e);
            }
        }

        async function renderSendtoNodes(filename) {
            sendtoWorkflow = filename;
            els.sendtoTitle.textContent = filename.replace(/\.json$/, '');
            els.sendtoBack.style.display = 'flex';
            els.sendtoList.innerHTML = '';
            els.sendtoStatus.textContent = 'Loading LoadImage nodes…';
            try {
                const res = await fetch(`/mini/get_workflow?filename=${encodeURIComponent(filename)}`);
                const wf = await res.json();
                if (wf.error) throw new Error(wf.error);
                const items = Object.entries(wf)
                    .filter(([id, n]) => n && (n.class_type === 'LoadImage' || n.class_type === 'LoadImageMask'))
                    .sort((a, b) => String(a[0]).localeCompare(String(b[0]), undefined, { numeric: true }));
                els.sendtoStatus.textContent = items.length ? '' : 'No LoadImage nodes in this workflow';
                for (const [id, node] of items) {
                    const title = node._meta && node._meta.title ? node._meta.title : (node.class_type + ' #' + id);
                    const current = node.inputs && node.inputs.image ? node.inputs.image.replace(/\.[^/.]+$/, '') : '';
                    els.sendtoList.appendChild(sendtoItem(
                        '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>',
                        title, current,
                        () => doSendTo(filename, id)
                    ));
                }
            } catch (e) {
                els.sendtoStatus.textContent = 'Failed to load nodes';
                console.error('[Gallery] Send-to nodes error:', e);
            }
        }

        async function doSendTo(filename, nodeId) {
            if (!modalImage) return;
            els.sendtoStatus.textContent = 'Loading…';
            let imgFile = modalImage.filename;
            // Output images live in the Output folder; LoadImage reads from Input, so bridge first.
            if (modalImage.type === 'output') {
                try {
                    const res = await fetch('/mini/bridge_image', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: imgFile, subfolder: modalImage.subfolder || '', type: 'output' })
                    });
                    if (res.ok) {
                        const data = await res.json();
                        imgFile = data.filename || imgFile;
                    } else { console.error('[Gallery] Bridge failed:', res.status); }
                } catch (e) { console.error('[Gallery] Bridge error:', e.message); }
            }
            window.location.href = `/mini/run?file=${encodeURIComponent(filename)}&set_image=${encodeURIComponent(nodeId)}&image=${encodeURIComponent(imgFile)}`;
        }

        // --- KEYBOARD SHORTCUTS ---
        function setupKeyboard() {
            document.addEventListener('keydown', (e) => {
                if (els.sendtoOverlay && els.sendtoOverlay.style.display !== 'none') {
                    if (e.key === 'Escape') closeSendTo();
                    return;
                }
                if (!els.modal.classList.contains('active')) return;
                if (e.key === 'Escape') closeGalleryModal();
                if (e.key === '+' || e.key === '=') setZoom(zoomScale * 1.3, window.innerWidth / 2, window.innerHeight / 2);
                if (e.key === '-') resetZoom();
            });

            els.modal.addEventListener('click', (e) => {
                if (e.target === els.modal || e.target === els.modalImg) {
                    closeGalleryModal();
                }
            });
        }

        // --- SHARED COMPONENT LOADER ---
        async function loadSharedComponents() {
            try {
                const [headerRes, footerRes] = await Promise.all([
                    fetch('/mini/shared/header.html?t=' + Date.now()),
                    fetch('/mini/shared/footer.html?t=' + Date.now())
                ]);

                if (headerRes.ok) {
                    const headerEl = document.getElementById('shared-header');
                    if (headerEl) headerEl.innerHTML = await headerRes.text();

                    const mobileBtn = document.getElementById('mobile-menu-btn');
                    const dropdown = document.getElementById('mobile-menu-dropdown');
                    if (mobileBtn && dropdown) {
                        mobileBtn.addEventListener('click', () => {
                            dropdown.classList.toggle('hidden');
                        });
                        document.addEventListener('click', (e) => {
                            // e.target is often the <svg>/<path> inside the button, not
                            // the button itself — so test containment, not identity.
                            if (!dropdown.contains(e.target) && !mobileBtn.contains(e.target)) {
                                dropdown.classList.add('hidden');
                            }
                        });
                    }
                }

                if (footerRes.ok) {
                    const footerEl = document.getElementById('shared-footer');
                    if (footerEl) footerEl.innerHTML = await footerRes.text();
                }
            } catch (e) { console.error('[Shared] Component load error:', e); }
        }

        // --- INIT ---
        async function init() {
            els.prevBtn.addEventListener('click', () => goToPage(currentPage - 1));
            els.nextBtn.addEventListener('click', () => goToPage(currentPage + 1));
            els.closeBtn.addEventListener('click', closeGalleryModal);
            els.dlBtn.addEventListener('click', downloadImage);
            if (els.favToggleBtn) {
                els.favToggleBtn.addEventListener('click', () => {
                    const src = els.modalImg.src;
                    const match = src.match(/filename=([^&]+)/);
                    if (!match) return;
                    const fname = decodeURIComponent(match[1]);
                    toggleFavorite({ filename: fname });
                    openModal(allImages.find(img => img.filename === fname) || { filename: fname, subfolder: currentPath, type: currentFolder });
                });
            }

            if (els.zoomToggleBtn) els.zoomToggleBtn.addEventListener('click', () => {
                if (zoomScale > 1) resetZoom();
                else setZoom(2.5, window.innerWidth / 2, window.innerHeight / 2);
            });
            if (els.zoomResetBtn) els.zoomResetBtn.addEventListener('click', resetZoom);

            if (els.btnOutput) els.btnOutput.addEventListener('click', () => navigate('output', ''));
            if (els.btnInput) els.btnInput.addEventListener('click', () => navigate('input', ''));
            if (els.btnRefresh) els.btnRefresh.addEventListener('click', () => {
                listingCache.clear();
                loadGallery();
            });

            if (els.sendtoBtn) els.sendtoBtn.addEventListener('click', openSendTo);
            if (els.sendtoClose) els.sendtoClose.addEventListener('click', closeSendTo);
            if (els.sendtoBack) els.sendtoBack.addEventListener('click', renderSendtoWorkflows);
            if (els.sendtoOverlay) els.sendtoOverlay.addEventListener('click', (e) => {
                if (e.target === els.sendtoOverlay) closeSendTo();
            });

            setupDoubleTapZoom();
            setupWheelZoom();
            setupKeyboard();
            renderBreadcrumb();
            await loadGallery();
            await loadSharedComponents();
        }

        init().catch(e => { console.error(e); alert('Init Error: ' + e.message); });
    </script>
</body>
</html>
