<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Comfy Mini</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000000; color: #d4d4d8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; height: 100vh; height: 100dvh; }
        .compact-card { background-color: #121212; border: 1px solid #27272a; border-radius: 8px; display: flex; flex-direction: column; position: relative; min-height: 100px; }
        .compact-card:hover { border-color: #3f3f46; }
        .card-body { flex: 1; overflow: hidden; min-height: 0; display: flex; flex-direction: column; gap: 0.75rem; padding-bottom: 0.5rem; }
        .input-dark { background-color: #09090b; border: 1px solid #27272a; color: #e4e4e7; }
        .input-dark:focus { border-color: #3b82f6; outline: none; }
        textarea.input-dark { flex: 1; resize: none; height: 100%; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }
        .edit-btn { @apply p-1.5 rounded bg-zinc-800 text-zinc-400 hover:text-white hover:bg-zinc-700 transition-colors; }

        /* Terminal Console */
        #terminal-container { position: fixed; bottom: 0; left: 0; right: 0; z-index: 51; padding-bottom: env(safe-area-inset-bottom, 0px); }
        #terminal-panel { background: #09090b; border-top: 1px solid #27272a; display: flex; flex-direction: column; max-height: 280px; overflow: hidden; transition: max-height 200ms ease; }
        #terminal-header { height: 30px; padding: 0 10px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #27272a; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
        .term-title { font-size: 10px; font-weight: 600; color: #52525b; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
        .term-dot { width: 6px; height: 6px; border-radius: 50%; transition: background-color 200ms, box-shadow 200ms; }
        #terminal-log { padding: 4px 8px; overflow-y: auto; flex: 1; min-height: 0; max-height: 230px; font-family: 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 9.5px; line-height: 1.6; color: #a1a1aa; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
        .term-line { white-space: pre-wrap; word-break: break-all; padding: 0 2px; border-radius: 2px; }
        .term-line:hover { background: rgba(39,39,42,0.5); }
        #terminal-toggle { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); width: 40px; height: 18px; border-radius: 10px 10px 0 0; background: #121212; border: 1px solid #27272a; border-bottom: none; display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; color: #52525b; transition: background 150ms, color 150ms; z-index: 52; touch-action: manipulation; }
        #terminal-toggle:hover { background: #18181b; color: #a1a1aa; }
        .toggle-chevron svg { width: 14px; height: 14px; transition: transform 200ms ease; will-change: transform; }
        @media (max-height: 500px) { #terminal-container { display: none !important; } }

        /* Compare slider — theme-matched */
        .compare-slider { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #27272a; outline: none; cursor: pointer; touch-action: none; }
        .compare-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #ffffff; border: 2px solid #3b82f6; box-shadow: 0 1px 4px rgba(0,0,0,.6); cursor: grab; }
        .compare-slider::-webkit-slider-thumb:active { cursor: grabbing; background: #dbeafe; }
        .compare-slider::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid #3b82f6; box-shadow: 0 1px 4px rgba(0,0,0,.6); cursor: grab; }
        .compare-slider::-moz-range-track { height: 4px; border-radius: 2px; background: #27272a; }
    </style>
</head>
<body class="w-full flex flex-col overflow-hidden text-xs">
    <div id="shared-header"></div>

    <!-- Page-specific header content (Run page) -->
    <header id="page-header" class="h-10 shrink-0 flex items-center justify-between px-3 border-b border-[#27272a] bg-[#09090b] z-40">
        <div class="flex items-center gap-2 min-w-0">
            <h1 id="header-title" class="font-semibold text-zinc-300 truncate tracking-tight uppercase">MINI RUNNER</h1>
        </div>
        <div class="flex items-center gap-3 shrink-0">
            <button id="edit-btn" class="text-zinc-500 hover:text-blue-400 p-2" title="Edit Layout"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
            <button id="save-layout-btn" class="hidden bg-green-700 hover:bg-green-600 text-white font-bold py-1 px-2 rounded text-[10px] uppercase">SAVE UI</button>
            <button id="generate-btn" class="bg-blue-600 hover:bg-blue-500 active:scale-95 text-white font-bold py-1 px-3 rounded shadow transition-all flex items-center gap-1 text-[10px] tracking-wider uppercase">ROLL</button>
            <button id="interrupt-btn" class="hidden bg-red-600 hover:bg-red-500 active:scale-95 text-white font-bold py-1 px-3 rounded shadow transition-all flex items-center gap-1 text-[10px] tracking-wider uppercase">STOP</button>
        </div>
    </header>

    <div id="hidden-container" class="hidden">
        <h3 class="text-xs font-bold text-zinc-500 uppercase mt-4 mb-2">Hidden Items</h3>
        <div id="hidden-list"></div>
    </div>

    <main class="flex-1 overflow-y-auto p-2 pb-[8rem] relative w-full space-y-2" id="main-scroll">
        <div class="compact-card min-h-[300px] flex items-center justify-center relative overflow-hidden group">
            <img id="result-image" class="max-h-[50vh] w-full object-contain opacity-50 transition-opacity cursor-pointer" src="" alt="">
            <img id="preview-image" class="absolute inset-0 w-full h-full object-contain hidden pointer-events-none" src="" alt="Live preview">
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-zinc-700 pointer-events-none"><span class="text-[10px] uppercase tracking-widest opacity-60">Ready</span></div>
            <div id="loading-overlay" class="absolute inset-0 bg-black/20 flex flex-col items-center justify-center hidden z-10 pointer-events-none">
                <div class="w-6 h-6 border-2 border-blue-500 border-t-transparent rounded-full animate-spin mb-2"></div>
                <span id="progress-text" class="text-[12px] font-mono font-bold text-blue-400 drop-shadow-[0_1px_3px_rgba(0,0,0,0.9)]">0%</span>
            </div>
            <button id="compare-btn" class="absolute bottom-2 right-2 z-20 hidden bg-zinc-800/80 hover:bg-zinc-700 text-[10px] font-bold text-zinc-300 hover:text-white uppercase tracking-wider rounded px-2 py-1 shadow transition-colors flex items-center gap-1 backdrop-blur-sm" title="Compare with input image">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4M16 17H4m0 0l4 4m-4-4l4-4"></path></svg>
                Compare
            </button>
        </div>
        <div id="controls-container" class="space-y-2"></div>
    </main>

    <div id="image-modal" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur hidden flex items-center justify-center p-2 opacity-0 transition-opacity duration-300">
        <button id="close-modal" class="absolute top-4 right-4 z-[101] bg-white/10 hover:bg-white/20 text-white rounded-full p-2 transition-colors"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        <img id="modal-image" class="max-w-full max-h-full object-contain" src="" alt="Fullscreen">
    </div>

    <!-- Compare overlay: new result (left of split) vs workflow input image (right of split) -->
    <div id="compare-modal" class="fixed inset-0 z-[100] bg-black/95 backdrop-blur hidden flex-col opacity-0 transition-opacity duration-300">
        <div class="flex items-center justify-between px-4 h-11 shrink-0 border-b border-[#27272a] bg-[#09090b]">
            <span class="text-[10px] font-semibold text-zinc-400 uppercase tracking-widest">Compare — New vs Input</span>
            <button id="compare-close" class="bg-white/10 hover:bg-white/20 text-white rounded-full p-2 transition-colors" title="Close compare"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
        </div>
        <div class="relative flex-1 overflow-hidden select-none">
            <img id="compare-old" class="absolute inset-0 w-full h-full object-contain" src="" alt="Input image">
            <img id="compare-new" class="absolute inset-0 w-full h-full object-contain" src="" alt="New image" style="clip-path: inset(0 50% 0 0)">
            <div id="compare-divider" class="absolute top-0 bottom-0 w-[2px] bg-blue-500 z-10 pointer-events-none" style="left: 50%">
                <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-7 h-7 rounded-full bg-white border-2 border-blue-500 shadow-lg flex items-center justify-center">
                    <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 9l4-4 4 4M8 15l4 4 4-4"></path></svg>
                </div>
            </div>
            <span class="absolute top-2 left-2 z-10 text-[9px] font-bold text-blue-300 uppercase tracking-widest bg-blue-500/10 rounded px-1.5 py-0.5 pointer-events-none">New</span>
            <span class="absolute top-2 right-2 z-10 text-[9px] font-bold text-zinc-400 uppercase tracking-widest bg-zinc-800/60 rounded px-1.5 py-0.5 pointer-events-none">Old</span>
        </div>
        <div class="shrink-0 px-4 py-3 border-t border-[#27272a] bg-[#09090b] flex items-center gap-3">
            <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-wider">Old</span>
            <input id="compare-slider" type="range" min="0" max="100" value="50" dir="rtl" class="compare-slider flex-1" title="Drag to compare">
            <span class="text-[9px] font-bold text-zinc-500 uppercase tracking-wider">New</span>
        </div>
    </div>

    <!-- Hidden Input for Image Upload -->
    <input type="file" id="image-upload-input" accept="image/*" class="hidden">

    <div id="shared-footer"></div>

    <script type="module" src="/mini/js/app.js"></script>
</body>
</html>
